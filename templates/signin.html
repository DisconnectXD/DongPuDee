{% extends "base.html" %}
{% block content %}
<section class="panel auth-box">
  <h1>Sign In</h1>
  <p class="lead">เข้าสู่ระบบเพื่อดูข้อมูลผู้ใช้และที่อยู่ในการจัดส่ง</p>

  {% if logged_in %}
    <div class="banner">สวัสดี {{ user_name }} คุณเข้าสู่ระบบแล้ว</div>
  {% endif %}

  <form method="post" class="auth-form">
    <div class="field">
      <label>อีเมล</label>
      <input type="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label>รหัสผ่าน</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn full">เข้าสู่ระบบ</button>
    <p class="note">ยังไม่มีบัญชี? <a href="/signup">สมัครสมาชิก</a></p>
  </form>
</section>
{% endblock %}
